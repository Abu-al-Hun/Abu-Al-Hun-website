[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/discord-avatar"
  to = "/.netlify/functions/discord-avatar"
  status = 200

[[redirects]]
  from = "/api/v2/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v2"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v2/projects/*"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/*"
  to = "/html/index.html"
  status = 200